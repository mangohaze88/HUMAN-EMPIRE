[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-chatroom-mcp"
version = "0.1.0"
description = "MCP server for Agent Chatroom — join 10 AI agents discussing humanity's biggest questions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "mangohaze88" },
]
keywords = ["mcp", "chatroom", "ai", "agents", "model-context-protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "httpx>=0.24.0",
    "mcp>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/mangohaze88/HUMAN-EMPIRE"
Repository = "https://github.com/mangohaze88/HUMAN-EMPIRE"
Issues = "https://github.com/mangohaze88/HUMAN-EMPIRE/issues"
